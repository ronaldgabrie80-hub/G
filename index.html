<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Gabriel IA Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
}

header {
    padding: 15px;
    background: #111827;
    display: flex;
    justify-content: space-between;
}

#chat {
    height: 70vh;
    overflow-y: auto;
    padding: 10px;
}

.msg {
    padding: 10px;
    margin: 8px;
    border-radius: 10px;
    max-width: 80%;
}

.user {
    background: #2563eb;
    margin-left: auto;
}

.bot {
    background: #374151;
}

#inputArea {
    display: flex;
    padding: 10px;
    background: #111827;
}

input {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
}

button {
    margin-left: 5px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
</style>
</head>

<body>

<header>
    <div>🤖 Gabriel IA Pro</div>
</header>

<div id="chat"></div>

<div id="inputArea">
    <input id="input" placeholder="Écris ton message...">
    <button onclick="send()">➤</button>
</div>

<script>

const API_KEY = "TA_CLE_API_ICI"; // 🔴 IMPORTANT

let chat = document.getElementById("chat");

function addMsg(text, type){
    let div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

async function send(){
    let input = document.getElementById("input");
    let text = input.value;
    if(!text) return;

    addMsg(text, "user");
    input.value = "";

    addMsg("⏳ réflexion...", "bot");

    let response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + API_KEY
        },
        body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [
                {role: "system", content: "Tu es Gabriel IA, une IA utile et claire."},
                {role: "user", content: text}
            ]
        })
    });

    let data = await response.json();

    chat.lastChild.remove(); // enlève "réflexion..."

    let reply = data.choices[0].message.content;
    addMsg(reply, "bot");
}

</script>

</body>
</html>
