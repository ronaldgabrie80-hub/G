<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gabronal</title>
<style>
body{
margin:0;
font-family:Arial, sans-serif;
display:flex;
height:100vh;
background:#0f172a;
color:white;
}

/* SIDEBAR */
#sidebar{
width:280px;
background:#111827;
display:flex;
flex-direction:column;
padding:10px;
}

#newChat{
padding:10px;
background:#2563eb;
border:none;
color:white;
cursor:pointer;
border-radius:8px;
margin-bottom:10px;
}

.chat-item{
padding:10px;
margin:5px 0;
background:#1f2937;
border-radius:6px;
cursor:pointer;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
}

.chat-item.active{
background:#374151;
}

/* CHAT */
#chat-container{
flex:1;
display:flex;
flex-direction:column;
}

#messages{
flex:1;
padding:15px;
overflow-y:auto;
}

.message{
padding:10px;
margin:5px 0;
border-radius:10px;
max-width:70%;
}

.user{
background:#2563eb;
align-self:flex-end;
}

.bot{
background:#1f2937;
align-self:flex-start;
}

#input-area{
display:flex;
padding:10px;
background:#111827;
}

input{
flex:1;
padding:10px;
border:none;
border-radius:8px;
outline:none;
}

button{
margin-left:10px;
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
background:#22c55e;
color:white;
}
</style>
</head>
<body>

<div id="sidebar">
<button id="newChat">+ Nouveau</button>
<div id="chatList"></div>
</div>

<div id="chat-container">
<div id="messages"></div>
<div id="input-area">
<input id="textInput" placeholder="Écris un message..." />
<button onclick="sendMessage()">Envoyer</button>
</div>
</div>

<script>
let conversations = JSON.parse(localStorage.getItem("conversations")) || [];
let currentChatId = null;

function save() {
localStorage.setItem("conversations", JSON.stringify(conversations));
}

function createChat() {
const chat = {
id: Date.now(),
title: "Nouvelle conversation",
messages: []
};
conversations.unshift(chat);
currentChatId = chat.id;
save();
renderChats();
renderMessages();
}

function renderChats() {
const list = document.getElementById("chatList");
list.innerHTML = "";

conversations.forEach(c => {
const div = document.createElement("div");
div.className = "chat-item" + (c.id === currentChatId ? " active" : "");
div.innerText = c.title;
div.onclick = () => {
currentChatId = c.id;
renderChats();
renderMessages();
};
list.appendChild(div);
});
}

function renderMessages() {
const chat = conversations.find(c => c.id === currentChatId);
const box = document.getElementById("messages");
box.innerHTML = "";
if(!chat) return;

chat.messages.forEach(m => {
const div = document.createElement("div");
div.className = "message " + m.role;
div.innerText = m.text;
box.appendChild(div);
});
}

function sendMessage() {
const input = document.getElementById("textInput");
const text = input.value.trim();
if(!text) return;

let chat = conversations.find(c => c.id === currentChatId);
if(!chat) return;

chat.messages.push({role:"user", text});

// Réponse IA simple
chat.messages.push({role:"bot", text:"Je suis Gabronal IA 🤖"});

// update title
if(chat.title === "Nouvelle conversation"){
chat.title = text.slice(0,20);
}

input.value = "";
save();
renderMessages();
renderChats();
}

// NEW CHAT
document.getElementById("newChat").onclick = () => {
createChat();
};

// INIT
if(conversations.length === 0){
createChat();
} else {
currentChatId = conversations[0].id;
renderChats();
renderMessages();
}
</script>

</body>
</html>
