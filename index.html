<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Gabriel IA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    background: #111827;
}

.title {
    font-size: 18px;
    font-weight: bold;
}

/* CHAT */
#chat {
    height: 70vh;
    overflow-y: auto;
    padding: 10px;
}

.msg {
    padding: 10px;
    margin: 8px;
    border-radius: 10px;
    max-width: 80%;
}

.user {
    background: #2563eb;
    margin-left: auto;
}

.bot {
    background: #374151;
}

/* INPUT */
#inputArea {
    display: flex;
    padding: 10px;
    background: #111827;
}

input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
}

button {
    margin-left: 5px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

#menu {
    position: relative;
}

#menuContent {
    display: none;
    position: absolute;
    right: 0;
    background: white;
    color: black;
    border-radius: 10px;
    overflow: hidden;
}

#menuContent div {
    padding: 10px;
    cursor: pointer;
}

#menuContent div:hover {
    background: #eee;
}
</style>
</head>

<body>

<header>
    <div class="title">Gabriel IA</div>

    <div id="menu">
        <button onclick="toggleMenu()">⋮</button>
        <div id="menuContent">
            <div onclick="quizMode()">🎯 Quiz IA</div>
            <div onclick="searchMode()">🔎 Recherche</div>
            <div onclick="reflectionMode()">🧠 Réflexion</div>
        </div>
    </div>
</header>

<div id="chat"></div>

<div id="inputArea">
    <input id="input" placeholder="Écris un message...">
    <button onclick="send()">➤</button>
    <button onclick="voice()">🎤</button>
</div>

<script>
let chat = document.getElementById("chat");

function addMsg(text, type){
    let div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* SIMPLE IA (remplace par API plus tard) */
function botReply(msg){
    if(msg.includes("bonjour")) return "Salut 👋 je suis Gabriel IA";
    if(msg.includes("quiz")) return "Mode quiz activé 🎯";
    return "Je réfléchis... 🤖 " + msg;
}

function send(){
    let input = document.getElementById("input");
    let text = input.value;
    if(!text) return;

    addMsg(text, "user");
    input.value = "";

    setTimeout(() => {
        addMsg(botReply(text), "bot");
    }, 500);
}

/* MENU */
function toggleMenu(){
    let m = document.getElementById("menuContent");
    m.style.display = m.style.display === "block" ? "none" : "block";
}

function quizMode(){
    addMsg("🎯 Quiz : Combien font 2 + 2 ?", "bot");
}

function searchMode(){
    addMsg("🔎 Recherche activée (simulation)", "bot");
}

function reflectionMode(){
    addMsg("🧠 Mode réflexion activé : pose une question complexe", "bot");
}

/* VOICE */
function voice(){
    let rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.lang = "fr-FR";
    rec.start();

    rec.onresult = function(e){
        let text = e.results[0][0].transcript;
        document.getElementById("input").value = text;
    }
}

/* SAUVEGARDE SIMPLE */
window.onload = () => {
    let saved = localStorage.getItem("chat");
    if(saved) chat.innerHTML = saved;
}

window.onbeforeunload = () => {
    localStorage.setItem("chat", chat.innerHTML);
}
</script>

</body>
</html>
